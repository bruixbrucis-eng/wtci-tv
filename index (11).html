}
function playerKey(e){
  const k=e.key,code=e.keyCode;
  if(UP){
    if(isBack(e)){e.preventDefault();cancelUpNext();closePlayer();return;}
    if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){
      e.preventDefault();f(document.activeElement===$('#unPlay')?$('#unCancel'):$('#unPlay'));return;
    }
    if(k==='MediaPlayPause'||code===179){e.preventDefault();const u=UP;cancelUpNext();playNext(u.c,u.n);}
    return;
  }
  if(isBack(e)){
    e.preventDefault();
    if(menuOpen())closeMenu();
    else if(isFullscreen())toggleFullscreen();
    else closePlayer();
    return;
  }
  if(k==='MediaPlayPause'||code===179||code===85){e.preventDefault();togglePlay();showCtl();return;}
  if(k==='MediaPlay'){e.preventDefault();vid.play().catch(()=>{});return;}
  if(k==='MediaPause'){e.preventDefault();vid.pause();return;}
  if(k==='MediaStop'||code===86){e.preventDefault();closePlayer();return;}
  if(k==='MediaFastForward'){e.preventDefault();showCtl(true,true);scrubStep(1,e);return;}
  if(k==='MediaRewind'){e.preventDefault();showCtl(true,true);scrubStep(-1,e);return;}
  if(k==='MediaTrackNext'||code===87){if(P&&P.type==='tv'){e.preventDefault();playNext(P);}return;}
  if(k==='MediaTrackPrevious'||code===88){if(P&&P.type==='tv'){e.preventDefault();scrubStep(-1,e);}return;}
  if(k==='VolumeUp'||code===24){e.preventDefault();changeVolume(.05);return;}
  if(k==='VolumeDown'||code===25){e.preventDefault();changeVolume(-.05);return;}
  if(k==='VolumeMute'||code===164){e.preventDefault();toggleMute();return;}
  if(k==='f'||k==='F'){e.preventDefault();toggleFullscreen();return;}
  if(k==='m'||k==='M'){e.preventDefault();toggleMute();return;}
  if(k==='c'||k==='C'){
    e.preventDefault();
    if(P&&P.subCur)setSub(null);
    else{
      const m=subOpts.find(o=>o.l2===SET.subLang)||subOpts[0];
      if(m)setSub(m);
    }
    return;
  }
  if(k==='q'||k==='Q'){
    if(QUALITY_GROUP&&QUALITY_GROUP.variants.length>1){
      e.preventDefault();
      const next=(QUALITY_GROUP.index+1)%QUALITY_GROUP.variants.length;
      swapQuality(QUALITY_GROUP.variants[next]);
    }
    return;
  }
  if(menuOpen()){
    if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();move(k);showCtl(false,true);}
    else if(k==='ArrowLeft'||k==='ArrowRight')e.preventDefault();
    return;
  }
  if(!playerEl.classList.contains('ctl')){
    if(k==='Enter'||k===' '){e.preventDefault();if($('#pStall').style.display!=='none'){$('#pStall').click();return;}if(skipVisible()){doSkip();return;}togglePlay();showCtl(true);return;}
    if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();showCtl(true,true);scrubStep(k==='ArrowRight'?1:-1,e);return;}
    if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();showCtl(true);return;}
    return;
  }
  let a=document.activeElement;
  if(!a||!a.closest||!a.closest('#player')||a===vid){f($('#scrub'));a=document.activeElement;}
  showCtl();
  if(a===$('#pStall')){
    if(k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();f($('#scrub'));}
    else if(k==='ArrowUp')e.preventDefault();
    return;
  }
  if(a===$('#pSkipIntro')){
    if(k==='ArrowDown'||k==='ArrowLeft'){e.preventDefault();f($('#scrub'));}
    else if(k==='ArrowUp'||k==='ArrowRight')e.preventDefault();
    return;
  }
  const onScrub=a===$('#scrub');
  if(onScrub){
    if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();scrubStep(k==='ArrowRight'?1:-1,e);return;}
    if(k==='ArrowDown'){e.preventDefault();commitScrub();f($('#pPlay'));return;}
    if(k==='ArrowUp'){e.preventDefault();commitScrub();f($('#pStall').style.display!=='none'?$('#pStall'):skipVisible()?$('#pSkipIntro'):$('#pBack'));return;}
    if(k==='Enter'||k===' '){e.preventDefault();commitScrub();togglePlay();return;}
    return;
  }
  if(k==='ArrowUp'){e.preventDefault();if(a.closest('.pbar'))f($('#scrub'));return;}
  if(k==='ArrowDown'){e.preventDefault();if(a===$('#pBack'))f($('#scrub'));return;}
  if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();move(k);}
}

let idleT=0,svI=0,svList=[],svN=0,svOn=0,lastIn=Date.now(),svCapT=0,svPlayerMode=false;
const DECADES=[[1960,1969],[1970,1979],[1980,1989],[1990,1999],[2000,2009],[2010,2019],[2020,2026]];
const KB=['20% 30%','80% 40%','50% 70%','30% 80%','70% 20%'];
async function saverItems(){
  const rs=await Promise.all(DECADES.map(([a,b])=>api('/discover/movie',{
    sort_by:'vote_count.desc','primary_release_date.gte':a+'-01-01','primary_release_date.lte':b+'-12-31','vote_count.gte':300,page:1+Math.floor(Math.random()*3)
  }).catch(()=>({results:[]}))));
  const out=[];
  rs.forEach(r=>r.results.filter(x=>x.backdrop_path).slice(0,14).forEach(x=>out.push(norm(x,'movie'))));
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
  return out;
}
function idleReset(){lastIn=Date.now();clearTimeout(idleT);if(SET.saver)idleT=setTimeout(startSaver,SET.saverDelay||60000);}
async function startSaver(){
  if(topLayer()==='saver'){idleReset();return;}
  if(NP||UP){idleReset();return;}
  if(topLayer()==='player' && P){
    if(!vid.paused||vid.readyState<3){idleReset();return;}
    svPlayerMode=true;
    svN=0;
    openLayer('saver');
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    showSv();clearInterval(svI);svI=setInterval(showSv,9000);
    return;
  }
  if(topLayer()==='player'){idleReset();return;}
  svPlayerMode=false;
  try{svList=await saverItems();}catch(e){idleReset();return;}
  if(!svList.length||Date.now()-lastIn<(SET.saverDelay||60000)-5000)return;
  svN=0;
  openLayer('saver');
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  showSv();clearInterval(svI);svI=setInterval(showSv,9000);
}
function showSv(){
  const Ls=$$('.sv'),cap=$('#svCap');
  let it;
  if(svPlayerMode && P){
    it = {
      title: P.it.title,
      year: P.it.year,
      backdrop: P.it.backdrop,
      poster: P.it.poster,
      _sub: P.type==='tv' && P.season ? ('S'+P.season+' \u00b7 E'+P.ep + (P.epTitle?' \u00b7 '+P.epTitle:'')) : (P.it.year||'')
    };
  } else {
    if(!svList.length){stopSaver();return;}
    it=svList[svN++%svList.length];
  }
  svOn=1-svOn;
  const n=Ls[svOn],o=Ls[1-svOn];
  const bg = it.backdrop ? img(it.backdrop,'w1280') : (it.poster ? img(it.poster,'w780') : '');
  n.style.backgroundImage = bg ? `url(${bg})` : 'none';
  n.style.transformOrigin=KB[Math.floor(Math.random()*KB.length)];
  n.classList.remove('kb');void n.offsetWidth;n.classList.add('kb','show');o.classList.remove('show');
  cap.classList.remove('on');clearTimeout(svCapT);
  svCapT=setTimeout(()=>{
    $('#svT').textContent=it.title||'';
    $('#svM').textContent = svPlayerMode
      ? (it._sub || 'Now playing')
      : ['Film',it.year].filter(Boolean).join(' \u00b7 ');
    cap.classList.add('on');
  },svN===1?300:900);
}
function stopSaver(){clearInterval(svI);clearTimeout(svCapT);svPlayerMode=false;closeLayer('saver');idleReset();}

function vcenter(el,box,instant){
  const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();
  const target=box.scrollTop+(r.top-b.top)-(b.height-r.height)/2;
  if(!isFinite(target))return;
  sTo(box,'scrollTop',target,instant);
}
function trackScroll(e,instant){
  const t=e.parentElement;
  if(!t||!t.classList.contains('track'))return;
  const pad=parseFloat(getComputedStyle(t).paddingLeft)||0;
  const l=e.offsetLeft,r=l+e.offsetWidth;
  const st=ANIM.get(t),base=st&&st.scrollLeft?st.scrollLeft.to:t.scrollLeft;
  let to=null;
  if(l<base+pad)to=Math.max(0,l-pad);
  else if(r>base+t.clientWidth-pad)to=r-t.clientWidth+pad;
  if(to!=null)sTo(t,'scrollLeft',to,instant);
  loadBgs(t,0,6);
}
document.addEventListener('focusin',e=>{
  const t=e.target;if(!t.classList)return;
  if(t.classList.contains('f'))sfx('move');
  const inst=INSTANT;INSTANT=false;
  if(t.closest('#main')){
    lastMain=t;
    const inf=t._item||t._info;if(inf)showInfo(inf);
    if(t.closest('.hero,.hl'))sTo($('#page'),'scrollTop',0,inst);else vcenter(t,$('#page'),inst);
    trackScroll(t,inst);
    if(loadMore&&t.classList.contains('card')){
      const cards=$$('#page .card');
      if(cards.indexOf(t)>=cards.length-12)loadMore();
    }
  }else if(t.closest('#detail')){
    if($('#detail').classList.contains('tvd')){trackScroll(t,inst);return;}
    if(t.closest('.dtop'))sTo($('#detail'),'scrollTop',0,inst);else vcenter(t,$('#detail'),inst);
    trackScroll(t,inst);
  }else if(t.closest('#picker')){
    t.scrollIntoView({block:'nearest'});
  }else if(t.closest('#pmenu')){
    t.scrollIntoView({block:'nearest'});
  }
});
document.addEventListener('click',()=>sfx('ok'));
const ctr=e=>{const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};};
function canSee(e){
  if(e.offsetParent===null)return false;
  const r=e.getBoundingClientRect();
  if(r.right<=0||r.left>=innerWidth)return false;
  const box=e.closest('#page,#detail,.pkl,#pmL');
  if(box){const b=box.getBoundingClientRect();if(r.bottom<=b.top+2||r.top>=b.bottom-2)return false;}
  const tr=e.closest('.track');
  if(tr){const b=tr.getBoundingClientRect();if(r.left>=b.right-2||r.right<=b.left+2)return false;}
  return true;
}
function scopeList(curEl){
  const l=topLayer();
  if(l==='player'&&menuOpen())return $$('#pmenu .f');
  if(l)return $$('.f',$('#'+l));
  if(curEl&&curEl.closest('#side'))return $$('#side .f');
  return $$('#main .f');
}
function move(k){
  const a=document.activeElement;
  const curEl=a&&a.classList&&a.classList.contains('f')?a:null;
  const layer=topLayer();
  if(!curEl){
    if(layer){const t=$('.f',$('#'+layer));if(t)f(t);}else focusMain();
    return;
  }
  const inSide=!!curEl.closest('#side');
  const list=scopeList(curEl).filter(e=>e!==curEl&&canSee(e));
  const c=ctr(curEl);let best=null;
  if(k==='ArrowLeft'||k==='ArrowRight'){
    const tol=curEl.offsetHeight*0.6,right=k==='ArrowRight';
    let bd=1e9;
    list.forEach(e=>{
      const p=ctr(e),dx=p.x-c.x;
      if(Math.abs(p.y-c.y)<tol&&(right?dx>4:dx<-4)&&Math.abs(dx)<bd){bd=Math.abs(dx);best=e;}
    });
    if(!best){
      if(right&&inSide){focusMain();return;}
      if(!right&&!inSide&&!layer){f($('#side .on')||$('#side .f'));return;}
    }
  }else{
    const down=k==='ArrowDown';
    const pool=list.filter(e=>{const p=ctr(e);return down?p.y>c.y+4:p.y<c.y-4;});
    if(pool.length){
      const minD=Math.min(...pool.map(e=>Math.abs(ctr(e).y-c.y)));
      let bd=1e9;
      pool.forEach(e=>{
        const p=ctr(e);
        if(Math.abs(p.y-c.y)<minD+30&&Math.abs(p.x-c.x)<bd){bd=Math.abs(p.x-c.x);best=e;}
      });
    }
  }
  if(best)f(best);
}
const isBack=e=>{
  const k=e.key,a=document.activeElement;
  return k==='Escape'||k==='GoBack'||k==='BrowserBack'||e.keyCode===4||(k==='Backspace'&&!(a&&a.tagName==='INPUT'));
};
document.addEventListener('keydown',e=>{
  idleReset();
  const k=e.key,l=topLayer(),a=document.activeElement,inInput=a&&a.tagName==='INPUT';
  if(l==='saver'){e.preventDefault();stopSaver();return;}
  if(ldOn){e.preventDefault();if(isBack(e)||k==='Enter')ldCancel();return;}
  if(l==='player'){playerKey(e);return;}
  if(l==='picker'){
    if((k==='Enter'||k===' ')&&PK&&PK.instant){
      const srcBtn=$$('.src',$('#pkL')).find(b=>b._s===PK.instant);
      if(srcBtn && (a===$('#pkT')||a===document.body||!a||a.closest('.pkh'))){
        e.preventDefault();srcBtn.click();return;
      }
    }
  }
  if(l==='cwMenu'){
    if(isBack(e)){e.preventDefault();closeCWMenu();return;}
    if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();move(k);return;}
    if(k==='Enter'||k===' '){return;}
    return;
  }
  if(l==='trailer'){e.preventDefault();if(isBack(e)||k==='Enter'||k===' ')closeTrailer();return;}
  if(k==='ContextMenu'||e.keyCode===82||((k==='m'||k==='M')&&!inInput)){
    if(l==='detail'&&D){
      if(a&&a._ep){e.preventDefault();openEpMenu(a);return;}
      e.preventDefault();openMoreMenu();return;
    }else if(!l&&a&&isCWCard(a)){
      const entry=getHist()[a._item.type+':'+a._item.id];
      if(entry){e.preventDefault();openCWMenu(a._item,entry,a);return;}
    }
  }
  if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){
    if(inInput){
      if(k==='ArrowLeft'&&a.selectionStart>0)return;
      if(k==='ArrowRight'&&a.selectionStart<a.value.length)return;
    }
    e.preventDefault();move(k);return;
  }
  if(isBack(e)){e.preventDefault();if(!back()&&window.WTCI&&WTCI.exit)WTCI.exit();}
});
['mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(topLayer()==='saver')stopSaver();else idleReset();},{passive:true}));
