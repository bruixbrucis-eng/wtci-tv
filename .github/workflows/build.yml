# WTCI TV: builds an installable Android TV / Fire TV / tablet app (APK)
# from the index.html in the repo root.
#
# Put this file at  .github/workflows/build.yml
# Every time you upload a new index.html the app is rebuilt automatically
# (Actions tab > latest run > Artifacts > wtci-tv-apk).

name: Build WTCI TV app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write the Android project
        run: |
          set -e
          test -f index.html || { echo "::error::index.html is missing from the repo root"; exit 1; }
          rm -rf tv
          mkdir -p tv tv/app tv/app/src/main tv/app/src/main/assets tv/app/src/main/java/com/wtci/tv tv/app/src/main/res/drawable-xhdpi tv/app/src/main/res/mipmap-xxhdpi tv/app/src/main/res/values
          cat > tv/settings.gradle <<'WTCI_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'WTCI-TV'
          include ':app'
          WTCI_EOF
          cat > tv/build.gradle <<'WTCI_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          WTCI_EOF
          cat > tv/gradle.properties <<'WTCI_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          WTCI_EOF
          cat > tv/app/build.gradle <<'WTCI_EOF'
          plugins {
              id 'com.android.application'
          }

          // The build number from GitHub (1, 2, 3 ...) so each new build counts as an update.
          def buildNumber = (project.findProperty('vCode') ?: '1').toString().toInteger()

          android {
              namespace = 'com.wtci.tv'
              compileSdk = 34

              defaultConfig {
                  applicationId = 'com.wtci.tv'
                  minSdk = 23
                  targetSdk = 34
                  versionCode = buildNumber
                  versionName = "1.0." + buildNumber
              }

              // One fixed signing key so every new build installs OVER the old one
              // (keeps your profiles, lists and watch history).
              signingConfigs {
                  stable {
                      storeFile file('wtci.keystore')
                      storePassword 'wtci-tv-key'
                      keyAlias 'wtci'
                      keyPassword 'wtci-tv-key'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.stable
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          WTCI_EOF
          cat > tv/app/src/main/AndroidManifest.xml <<'WTCI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <!-- TVs have no touchscreen; without these the app is hidden from TV installs -->
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:label="WTCI"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <!-- phones / tablets -->
                          <category android:name="android.intent.category.LAUNCHER" />
                          <!-- Android TV + Fire TV home screen -->
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          WTCI_EOF
          cat > tv/app/src/main/res/values/styles.xml <<'WTCI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          WTCI_EOF
          cat > tv/app/src/main/java/com/wtci/tv/MainActivity.java <<'WTCI_EOF'
          package com.wtci.tv;

          import android.app.Activity;
          import android.app.UiModeManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.util.DisplayMetrics;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashMap;

          public class MainActivity extends Activity {

              /**
               * Extra border around the page on TVs, as a percent of the screen on each side.
               * Some TVs crop the edges (overscan). Set to 0 to turn it off.
               */
              private static final float TV_BORDER_PERCENT = 2.0f;

              private static final int BG = Color.parseColor("#09090b");

              // The app is served from a fake https origin so fetch/CORS, localStorage and
              // the YouTube trailer referrer behave like a normal website.
              private static final String HOST = "appassets.androidplatform.net";
              private static final String START_URL = "https://" + HOST + "/index.html";

              // Added to the WebView user agent so the page can switch on its TV styles.
              private static final String UA_TAG = " WTCITV";

              // Sends a "GoBack" key press to the page. Returns "ok" if the wtci page is
              // loaded (so it handled Back), otherwise "no" and we just close the app.
              private static final String BACK_JS =
                      "(function(){try{"
                      + "if(!document.getElementById('side'))return 'no';"
                      + "var e=new KeyboardEvent('keydown',{key:'GoBack',code:'GoBack',keyCode:4,which:4,"
                      + "bubbles:true,cancelable:true});"
                      + "document.dispatchEvent(e);return 'ok';"
                      + "}catch(x){return 'no';}})()";

              private WebView web;
              private long lastExitTap = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(BG);

                  web = new WebView(this);
                  web.setBackgroundColor(BG);

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  if (isTv() && TV_BORDER_PERCENT > 0) {
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      int mx = Math.round(dm.widthPixels * TV_BORDER_PERCENT / 100f);
                      int my = Math.round(dm.heightPixels * TV_BORDER_PERCENT / 100f);
                      lp.setMargins(mx, my, mx, my);
                  }
                  root.addView(web, lp);
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setUserAgentString(s.getUserAgentString() + UA_TAG);

                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setHorizontalScrollBarEnabled(false);
                  web.setVerticalScrollBarEnabled(false);
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.addJavascriptInterface(new Bridge(), "WTCI");

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          WebResourceResponse res = serveAsset(request.getUrl());
                          return res != null ? res : super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.requestFocus();
                      }
                  });

                  web.loadUrl(START_URL);
                  web.requestFocus();
              }

              /** Page -> app calls. Only used to quit when Back is pressed on the home screen. */
              private class Bridge {
                  @JavascriptInterface
                  public void exit() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              confirmExit();
                          }
                      });
                  }
              }

              private void confirmExit() {
                  long now = SystemClock.uptimeMillis();
                  if (now - lastExitTap < 2000) {
                      finish();
                      return;
                  }
                  lastExitTap = now;
                  Toast.makeText(this, "Press Back again to exit", Toast.LENGTH_SHORT).show();
              }

              /** Serve files from app/src/main/assets as if they lived on HOST. */
              private WebResourceResponse serveAsset(Uri uri) {
                  if (uri == null || !HOST.equals(uri.getHost())) return null;
                  String path = uri.getPath();
                  if (path == null || path.length() <= 1) path = "/index.html";
                  try {
                      InputStream in = getAssets().open(path.substring(1));
                      return new WebResourceResponse(mimeFor(path), "utf-8", in);
                  } catch (IOException e) {
                      return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found",
                              new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                  }
              }

              private static String mimeFor(String path) {
                  String p = path.toLowerCase();
                  if (p.endsWith(".html") || p.endsWith(".htm")) return "text/html";
                  if (p.endsWith(".js")) return "application/javascript";
                  if (p.endsWith(".css")) return "text/css";
                  if (p.endsWith(".json")) return "application/json";
                  if (p.endsWith(".png")) return "image/png";
                  if (p.endsWith(".jpg") || p.endsWith(".jpeg")) return "image/jpeg";
                  if (p.endsWith(".svg")) return "image/svg+xml";
                  if (p.endsWith(".webp")) return "image/webp";
                  return "application/octet-stream";
              }

              private boolean isTv() {
                  UiModeManager um = (UiModeManager) getSystemService(Context.UI_MODE_SERVICE);
                  if (um != null && um.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION) return true;
                  PackageManager pm = getPackageManager();
                  return pm.hasSystemFeature("android.software.leanback")
                          || pm.hasSystemFeature("amazon.hardware.fire_tv");
              }

              // ---- Back button -------------------------------------------------------
              // WebView never hands the remote's Back key to JavaScript, so we do it.

              private void sendBackToPage() {
                  web.evaluateJavascript(BACK_JS, new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                          if (!"\"ok\"".equals(value)) finish();
                      }
                  });
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event.getKeyCode() == KeyEvent.KEYCODE_BACK) {
                      if (event.getAction() == KeyEvent.ACTION_UP && !event.isCanceled()) sendBackToPage();
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public void onBackPressed() {
                  // Gesture / on-screen Back (tablets)
                  sendBackToPage();
              }

              // ---- Full screen / lifecycle -------------------------------------------

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          WTCI_EOF
